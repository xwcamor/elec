name: Inspect LAP workbook
on:
  push:
    branches: [inspect-lap-workbook]
    paths:
      - ".github/workflows/inspect-lap.yml"
      - ".github/scripts/inspect_lap.py"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read LAP workbook
        run: |
          python -m pip install --quiet openpyxl
          python .github/scripts/inspect_lap.py
