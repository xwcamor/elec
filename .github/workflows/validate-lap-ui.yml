name: Validate LAP UI changes
on:
  push:
    branches: [main, 'refactor/**']
    paths:
      - "index.php"
      - "assets/**"
      - "app/**"
      - "tests/**"
      - ".github/workflows/validate-lap-ui.yml"
      - ".github/workflows/cleanup-merged-branches.yml"
      - "api.php"
      - "bootstrap.php"
      - "config/**"
      - "database/**"
      - "VERSION"
      - "CHANGELOG.md"
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/electrical-tests.js
          node --check assets/plan.js
      - name: Module boundaries
        run: python tests/check-module-boundaries.py
      - name: Validation contract
        run: python tests/check-validation-contract.py
      - name: Design system contract
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("index.php").read_text(encoding="utf-8")
          css = Path("assets/design-system.css").read_text(encoding="utf-8")
          app_css = Path("assets/app.css").read_text(encoding="utf-8")
          app_link = html.find("assets/app.css?v=")
          design_link = html.find("assets/design-system.css?v=")
          assert app_link >= 0 and design_link > app_link, "design-system.css debe cargarse después de app.css"
          for required in ('id="configStepper"', 'id="planStepper"', 'class="ui-step-icon"', 'data-step-status', 'id="toast"'):
              assert required in html, f"Falta markup compartido: {required}"
          for required in ('--ui-line:', '#configStepper>.ui-step', '#planStepper>.ui-step', '.test-view-tab.active', '[aria-invalid="true"]'):
              assert required in css, f"Falta regla del design system: {required}"
          assert "--ui-line" in app_css, "app.css debe conservar el token de borde base"
          print("Design system OK: hoja compartida, steps, separador y validación accesible.")
          PY
      - name: PHP syntax
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Validate wizard markup
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Ids(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if values.get("id"):
                      self.ids.append(values["id"])
          parser = Ids()
          parser.feed(Path("index.php").read_text(encoding="utf-8"))
          duplicates = sorted({x for x in parser.ids if parser.ids.count(x) > 1})
          assert not duplicates, f"IDs duplicados: {duplicates}"
          required = {"planPage","planStepper","planSharedSection","planSelectionSection","planResultsSection","planReviewSection","planTestNav","planStepBack","planStepNext"}
          missing = sorted(required - set(parser.ids))
          assert not missing, f"Faltan controles del asistente: {missing}"
          print("Markup wizard OK; IDs únicos y etapas presentes.")
          PY
